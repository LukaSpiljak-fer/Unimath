name: Deploy to cPanel (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # FTP račun je već ograničen na public_html, pa je root "./"
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            backend/**
            scripts/**
            .vscode/**
            README.md
            DEPLOYMENT.md
